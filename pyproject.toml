[project]
name = "floe"
version = "0.2.0"
description = "Minimal local Python workflows with systemd scheduling and journald history"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["tenacity>=9.1.4,<10"]

[project.scripts]
floe = "floe_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["floe", "floe_cli", "floe_web"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: live tests against the real user systemd and journald (run with -m e2e)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
