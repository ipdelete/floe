[project]
name = "floe"
version = "0.1.0"
description = "Minimal local Python workflows with systemd scheduling and journald history"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
floe = "floe_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["floe", "floe_cli"]

[tool.pytest.ini_options]
markers = [
    "systemd_e2e: opt-in tests deploying generated workflows to the real user systemd and journald",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
