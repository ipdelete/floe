name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      artifact-id:
        value: ${{ jobs.check.outputs.artifact-id }}
      prerelease:
        value: ${{ jobs.check.outputs.prerelease }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Check prerequisites
        run: |
          test "$(id -u)" != 0
          /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 14) else "System Python 3.14+ required")'
          command -v systemd-analyze
          command -v systemctl
          command -v journalctl
      - name: Validate release version and notes
        id: release
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          # BEGIN release-version-check
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          number = r'(0|[1-9][0-9]*)'
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(rf'v{number}\.{number}\.{number}(?:-(alpha|beta|rc)\.{number})?', tag)
          if match is None:
              raise SystemExit('Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-(alpha|beta|rc).N')
          major, minor, patch, kind, serial = match.groups()
          suffix = '' if kind is None else {'alpha': 'a', 'beta': 'b', 'rc': 'rc'}[kind] + serial
          version = f'{major}.{minor}.{patch}{suffix}'
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'floe' or project['version'] != version:
              raise SystemExit(f'{tag} requires package version {version}')
          lock = tomllib.loads(Path('uv.lock').read_text())
          packages = [item for item in lock['package'] if item['name'] == 'floe']
          if len(packages) != 1 or packages[0]['version'] != version or packages[0]['source'] != {'editable': '.'}:
              raise SystemExit('Run uv lock: the locked project version does not match')
          heading = re.compile(rf'## \[{re.escape(tag[1:])}\](?: - [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})?')
          sections = []
          active = False
          for line in Path('CHANGELOG.md').read_text().splitlines():
              if line.startswith('## '):
                  active = heading.fullmatch(line) is not None
                  if active:
                      sections.append([])
              elif active:
                  sections[-1].append(line)
          if len(sections) != 1 or not (notes := '\n'.join(sections[0]).strip()):
              raise SystemExit(f'Add exactly one nonempty CHANGELOG.md section for [{tag[1:]}]')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prerelease={str(kind is not None).lower()}\n')
          PY
          # END release-version-check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - run: uv sync --locked
      - name: Test without real-systemd E2E
        run: uv run --locked pytest -q -m 'not systemd_e2e'
      - name: Validate deployment offline
        run: uv run --locked python examples/deploy_demo.py
      - name: Build wheel through source distribution
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build --sdist
          uv build --wheel dist/*.tar.gz
      - name: Check built wheel outside checkout
        run: |
          uv venv --python /usr/bin/python3 "$RUNNER_TEMP/installed"
          uv pip install --offline --no-deps --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          installed/bin/floe --help
          installed/bin/python -I -c 'import floe; from floe_web import render; from floe_web.assets import ICON_NAMES; [render.icon(name) for name in ICON_NAMES]; render.favicon(); render.document("Workflows", render.inventory([]), "/")'
          site=$(installed/bin/python -I -c 'import floe,pathlib; print(pathlib.Path(floe.__file__).resolve().parents[1])')
          PYTHONPATH="$site" /usr/bin/python3 -s -m floe_cli --help
      - name: Checksum distributions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz) > "$RUNNER_TEMP/SHA256SUMS"
          cp "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          if [[ -n "$RELEASE_TAG" ]]; then cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
