name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      artifact-id:
        value: ${{ jobs.check.outputs.artifact-id }}
      prerelease:
        value: ${{ jobs.check.outputs.prerelease }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Runs for every change. Markdown-only changes stop here: `check` is then
  # skipped, which a required status check counts as passing.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Look for changes other than Markdown
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ -n "$RELEASE_TAG" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            code=true
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qv '\.md$'; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Check prerequisites
        run: |
          test "$(id -u)" != 0
          command -v systemd-analyze
          command -v systemctl
          command -v journalctl
      - name: Validate release version and notes
        id: release
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 .github/scripts/check_release.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - run: uv sync --locked
      - name: Test
        run: uv run --locked pytest -q
      - name: Validate deployment offline
        run: uv run --locked python examples/deploy_demo.py
      - name: Build wheel through source distribution
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          uv build
      - name: Check built wheel outside checkout
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/installed"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/installed" uv sync --offline --locked --no-dev --no-install-project
          uv pip install --offline --no-deps --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          installed/bin/floe --help
          installed/bin/python -I -c 'import floe; from floe_web import render; from floe_web.assets import ICON_NAMES; [render.icon(name) for name in ICON_NAMES]; render.favicon(); render.document("Workflows", render.inventory([]), "/")'
          site=$(installed/bin/python -I -c 'import floe,pathlib; print(pathlib.Path(floe.__file__).resolve().parents[1])')
          PYTHONPATH="$site" installed/bin/python -m floe_cli --help
      - name: Checksum distributions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          if [[ -n "$RELEASE_TAG" ]]; then cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
